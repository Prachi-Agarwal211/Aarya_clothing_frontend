# Alertmanager Configuration for Aarya Clothing
# Routes alerts to Slack (real-time) and email (daily digest)
#
# Setup:
# 1. Create a Slack Incoming Webhook: https://api.slack.com/messaging/webhooks
# 2. Set ALERTMANAGER_SLACK_WEBHOOK_URL in .env
# 3. Run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d alertmanager prometheus

global:
  resolve_timeout: 5m

route:
  receiver: 'slack-notifications'
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts → immediate Slack notification, repeat every hour
    - match:
        severity: critical
      receiver: 'slack-notifications'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts → Slack with longer intervals
    - match:
        severity: warning
      receiver: 'slack-notifications'
      repeat_interval: 4h

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER'
        channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.alert.title" . }}'
        text: '{{ template "slack.alert.text" . }}'

  # Fallback: email digest for alerts not routed to Slack
  - name: 'email-digest'
    email_configs:
      - to: 'alerts@aaryaclothing.in'
        from: 'alertmanager@aaryaclothing.in'
        smarthost: 'smtp.hostinger.com:465'
        auth_username: 'noreply@aaryaclothing.in'
        auth_password: 'CHANGE_ME_BEFORE_DEPLOY'
        require_tls: false
        send_resolved: true

inhibit_rules:
  # If critical alert fires, suppress warning for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

templates:
  - '/etc/alertmanager/templates/*.tmpl'
