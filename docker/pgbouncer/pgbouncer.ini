[databases]
aarya_clothing = host=postgres port=5432 dbname=aarya_clothing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction

# CRITICAL for PgBouncer transaction mode: reset session state between transactions.
# Prevents stale prepared statements, SET commands, and temp tables from leaking.
server_reset_query = DISCARD ALL

# Connection limits - TUNED FOR 500+ CONCURRENT PAYMENTS
# At peak (flash sale / marketing spike), all services + webhooks + frontend
# can push 150+ simultaneous backend queries.  default_pool_size=100 gives
# headroom; PgBouncer queues excess clients cheaply until a slot opens.
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 20
reserve_pool_timeout = 3

# Timeouts - TUNED
# server_lifetime must be < PostgreSQL tcp_keepalives_idle (default 600s)
# to prevent PostgreSQL from killing idle server connections.
server_lifetime = 600
server_idle_timeout = 300
server_connect_timeout = 10
server_login_retry = 3
query_timeout = 25
query_wait_timeout = 8
client_idle_timeout = 0
client_login_timeout = 20

# Performance - OPTIMIZED
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 20
tcp_keepintvl = 5

# Logging - OPTIMIZED
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

# Admin settings
admin_users = postgres
stats_users = stats, postgres
